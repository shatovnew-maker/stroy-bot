name: Стройка и недвижимость ДФО

on:
  schedule:
    # Время в UTC (Владивосток = UTC+10). GitHub иногда запускает на 5–30 минут позже.
    - cron: "57 21 * * *"              # каждый день в 07:57 — утренняя сводка
    - cron: "23 23,1,3,5,7,9 * * *"    # 09:23, 11:23, 13:23, 15:23, 17:23, 19:23 — срочные законы
  workflow_dispatch:
    inputs:
      mode:
        description: "Что запустить"
        type: choice
        options: [digest, alerts]
        default: digest
      hours:
        description: "За сколько часов искать новости (пусто — как в config.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stroy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS: ${{ github.event.inputs.hours }}
          MODE: ${{ github.event.schedule == '57 21 * * *' && 'digest' || github.event.schedule && 'alerts' || github.event.inputs.mode || 'digest' }}
        run: python bot.py

      - name: Сохранить состояние
        if: success()
        run: |
          git config user.name "stroy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Обновить состояние бота" && git push)
