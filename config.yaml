# Бот «Стройка и недвижимость ДФО». Правки вступают в силу со следующего запуска.

timezone: Asia/Vladivostok
lookback_hours: 30            # за сколько часов собирать новости для утренней сводки
max_primorye: 20              # не больше стольких новостей Приморья в сводке
max_dfo: 8                    # не больше стольких новостей по остальному ДФО
max_snippet_chars: 220        # длина выдержки из статьи
send_empty: true              # присылать сводку, даже если новостей нет

# --- Новости: поисковые запросы (Google News и Bing News, русская версия) ---
news_queries:
  primorye:
    - Владивосток застройщик
    - Владивосток новостройки
    - Владивосток жилой комплекс
    - Владивосток квартиры цены
    - Владивосток стройка
    - Владивосток ПЗЗ
    - Приморье строительство жилья
    - Приморье ипотека
    - Приморье КРТ
    - Приморье ИЖС
    - Приморский край недвижимость
    - Приморье застройщик
    - Находка жилой комплекс
    - Уссурийск строительство жилья
    - Артем застройщик
  dfo:
    - дальневосточная ипотека
    - арктическая ипотека
    - Дальний Восток строительство жилья
    - ДФО ввод жилья
    - мастер-план Дальний Восток
    - Хабаровск застройщик
    - Хабаровск КРТ
    - Южно-Сахалинск строительство жилья
    - Якутск жилой комплекс
    - Благовещенск новостройки
  federal_law:
    - законопроект строительство Госдума
    - Градостроительный кодекс изменения
    - закон долевое строительство
    - Минстрой приказ свод правил
    - эскроу закон застройщики
    - ИЖС закон изменения

# --- Слова, по которым бот решает, что новость «про стройку и недвижимость» ---
topic_words:
  - застрой
  - новострой
  - жил(ой|ого|ые|ых|ье|ья|ьё|ищ)
  - квартир
  - ипотек
  - строит
  - стройк
  - ЖК
  - ИЖС
  - КРТ
  - ПЗЗ
  - градостро
  - девелоп
  - недвижим
  - долев
  - эскроу
  - ввод(а|е)? жиль
  - земельн(ый|ого|ые|ых) участ
  - квадратн(ый|ого|ых) метр
  - мастер-план
  - генплан
  - проект планировки
  - капремонт
  - аренд(а|ы|у) жиль

# География: Приморье — основная; ДФО — только «крупное» (см. dfo_major_words)
primorye_words:
  - Владивосток
  - Приморь
  - Приморск(ий|ого|ом) кра
  - Находк
  - Уссурийск
  - Артем
  - Артём
  - Большой Камень
  - Большого Камня
  - Русск(ий|ом) остров
  - Спасск-Дальн
  - Партизанск
  - Лесозаводск
  - Арсеньев
  - Дальнегорск
  - Надеждинск
  - Шкотов
dfo_words:
  - Хабаровск
  - Сахалин
  - Южно-Сахалинск
  - Якут
  - Благовещенск
  - Амурск(ая|ой) област
  - Камчат
  - Магадан
  - Чукот
  - Биробиджан
  - ЕАО
  - Забайкал
  - Чит(а|е|ы)\b
  - Бурят
  - Улан-Удэ
  - Комсомольск-на-Амуре
  - ДФО
  - Дальн(ий|его|ем) Восток
  - дальневосточн
dfo_major_words:
  - ипотек
  - КРТ
  - мастер-план
  - млрд
  - ввод жиль
  - программ
  - реновац
  - федеральн
  - Минвостокразвития
  - КРДВ
  - рекорд

# --- Законы и нормы ---
law_words:
  - градостро
  - строител
  - строит
  - жилищн
  - жил(ые|ых|ого|ой) помещен
  - застрой
  - долев
  - ИЖС
  - индивидуальн(ого|ое) жилищн
  - проектн(ой|ая) документац
  - экспертиз
  - свод(а|ов)? правил
  - \bСП \d
  - СНиП
  - технически(й|х) регламент
  - территориальн(ого|ое) планирован
  - землепольз
  - земельн
  - категори(и|ю) земель
  - комплексн(ого|ое) развити
  - эскроу
  - ипотеч
  - ипотек
  - капитальн(ого|ый) ремонт
  - ввод(а)? в эксплуатац
  - разрешени(е|я|й) на строительство
  - архитектур
  - Минстро

legal_sources:
  - name: Проекты федеральных актов
    short: regulation.gov.ru
    type: rss
    url: https://regulation.gov.ru/api/public/Rss/
    level: federal
    always_if: "minstroy|Минстрой"        # проекты Минстроя берём всегда
  - name: Минстрой России
    short: Минстрой
    type: links
    url: https://minstroyrf.gov.ru/press/?d=news
    base: https://minstroyrf.gov.ru
    link_pattern: "^/press/[a-z0-9-]{20,}/$"
    level: federal
  - name: ФАУ «ФЦС» (своды правил)
    short: ФАУ ФЦС
    type: links
    url: https://faufcc.ru/press-tsentr/novosti
    base: https://faufcc.ru
    link_pattern: "^/press-tsentr/novosti/[a-z0-9-]{10,}$"
    level: federal
  - name: ЗС Приморья — законопроекты
    short: ЗС Приморья
    type: zspk
    url: https://monitoring.zspk.gov.ru/Home/Index?ais_uid=1&type=zp&RowsOnPage=50
    base: https://monitoring.zspk.gov.ru
    kind: законопроект
    level: regional
  - name: ЗС Приморья — принятые законы
    short: ЗС Приморья
    type: zspk
    url: https://monitoring.zspk.gov.ru/Home/Index?ais_uid=1&type=zakon&RowsOnPage=50
    base: https://monitoring.zspk.gov.ru
    kind: закон
    level: regional
  - name: ЗС Приморья — новости
    short: ЗС Приморья
    type: rss
    url: https://www.zspk.gov.ru/press-service/yandex-rss.php
    level: regional
  - name: Администрация Владивостока
    short: Администрация Владивостока
    type: links
    url: https://www.vlc.ru/event/news/
    base: https://www.vlc.ru
    link_pattern: "^/event/news/\\d+/$"
    level: regional

# Новость из федеральных запросов попадёт в сводку, только если в заголовке есть одно из этих слов
law_news_words:
  - закон
  - законопроект
  - Госдум
  - Совет Федерации
  - постановлени
  - приказ
  - кодекс
  - правил
  - норм
  - \bСП\b
  - Минстрой
  - Правительств
  - вступ(ает|ят|ил|ило|или) в силу
max_law_news: 6

# Проекты актов и новости ведомств с этими словами не присылаем (кадры, награды и т.п.)
skip_words:
  - наград
  - почетн
  - почётн
  - гражданск(ой|ую|ая) служб
  - служащ
  - замещени
  - кадров
  - конкурс на
  - совещани

# Сайты, которые не показываем (агрегаторы и дубли)
exclude_domains:
  - news.google.com
  - dzen.ru
  - yandex.ru
  - msn.com
  - vk.com
  - ok.ru
  - t.me
